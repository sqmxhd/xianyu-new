name: xianyu

# 项目容器模式：只启动闲鱼 API、Worker 和 HTTPS 网关。
# MySQL、Redis 由外部提供；需要填写 .env.docker 中的两条连接地址。

x-application-environment: &application-environment
  XIANYU_DATABASE_URL: "${XIANYU_DATABASE_URL:?请在 .env.docker 中填写外部 MySQL 连接地址}"
  XIANYU_REDIS_URL: "${XIANYU_REDIS_URL:?请在 .env.docker 中填写外部 Redis 连接地址}"
  XIANYU_RUNTIME_SECRET_DIR: /run/xianyu-secrets
  XIANYU_INTERNAL_API_URL: http://api:8000
  XIANYU_API_HEALTH_URL: http://api:8000/api/health
  XIANYU_PUBLIC_BASE_URL: "${XIANYU_PUBLIC_BASE_URL:-}"
  XIANYU_CORS_ORIGINS: "${XIANYU_CORS_ORIGINS:-}"
  XIANYU_JWT_EXPIRES_MINUTES: "${XIANYU_JWT_EXPIRES_MINUTES:-10080}"
  XIANYU_COOKIE_RENEWAL_ENABLED: "${XIANYU_COOKIE_RENEWAL_ENABLED:-true}"
  XIANYU_COOKIE_RENEWAL_INTERVAL_HOURS: "${XIANYU_COOKIE_RENEWAL_INTERVAL_HOURS:-1}"
  XIANYU_COOKIE_KEEPALIVE_INTERVAL_SECONDS: "${XIANYU_COOKIE_KEEPALIVE_INTERVAL_SECONDS:-600}"
  XIANYU_COOKIE_KEEPALIVE_RECHECK_MIN_SECONDS: "${XIANYU_COOKIE_KEEPALIVE_RECHECK_MIN_SECONDS:-15}"
  XIANYU_COOKIE_KEEPALIVE_RECHECK_MAX_SECONDS: "${XIANYU_COOKIE_KEEPALIVE_RECHECK_MAX_SECONDS:-30}"
  XIANYU_COOKIE_RENEWAL_SCAN_SECONDS: "${XIANYU_COOKIE_RENEWAL_SCAN_SECONDS:-60}"
  XIANYU_COOKIE_RENEWAL_MANUAL_COOLDOWN_SECONDS: "${XIANYU_COOKIE_RENEWAL_MANUAL_COOLDOWN_SECONDS:-3600}"
  XIANYU_CONVERSATION_SYNC_INTERVAL_SECONDS: "${XIANYU_CONVERSATION_SYNC_INTERVAL_SECONDS:-180}"
  XIANYU_CHATWOOT_RECONCILE_INTERVAL_SECONDS: "${XIANYU_CHATWOOT_RECONCILE_INTERVAL_SECONDS:-900}"
  XIANYU_CHATWOOT_READ_SYNC_INTERVAL_SECONDS: "${XIANYU_CHATWOOT_READ_SYNC_INTERVAL_SECONDS:-20}"
  XIANYU_CONVERSATION_FULL_SYNC_MAX_PAGES: "${XIANYU_CONVERSATION_FULL_SYNC_MAX_PAGES:-50}"
  XIANYU_QR_LOGIN_WORKERS: "${XIANYU_QR_LOGIN_WORKERS:-2}"
  XIANYU_QR_LOGIN_MAX_ACTIVE_SESSIONS: "${XIANYU_QR_LOGIN_MAX_ACTIVE_SESSIONS:-4}"
  XIANYU_RUNTIME_START_CONCURRENCY: "${XIANYU_RUNTIME_START_CONCURRENCY:-3}"
  XIANYU_RUNTIME_START_JITTER_SECONDS: "${XIANYU_RUNTIME_START_JITTER_SECONDS:-3}"
  XIANYU_CONVERSATION_SYNC_CONCURRENCY: "${XIANYU_CONVERSATION_SYNC_CONCURRENCY:-3}"
  XIANYU_COOKIE_RENEWAL_CONCURRENCY: "${XIANYU_COOKIE_RENEWAL_CONCURRENCY:-2}"
  XIANYU_WORKER_CONCURRENCY: "${XIANYU_WORKER_CONCURRENCY:-4}"
  XIANYU_WORKER_LEASE_SECONDS: "${XIANYU_WORKER_LEASE_SECONDS:-120}"
  XIANYU_WORKER_LEASE_RENEW_SECONDS: "${XIANYU_WORKER_LEASE_RENEW_SECONDS:-30}"
  XIANYU_IM_VERIFICATION_SESSION_SECONDS: "${XIANYU_IM_VERIFICATION_SESSION_SECONDS:-600}"
  XIANYU_ACCOUNT_BROWSER_IDLE_SECONDS: "${XIANYU_ACCOUNT_BROWSER_IDLE_SECONDS:-1800}"
  XIANYU_ACCOUNT_BROWSER_MAX_SESSION_SECONDS: "${XIANYU_ACCOUNT_BROWSER_MAX_SESSION_SECONDS:-28800}"
  XIANYU_ACCOUNT_BROWSER_MAX_SESSIONS: "${XIANYU_ACCOUNT_BROWSER_MAX_SESSIONS:-3}"
  XIANYU_FINGERPRINT_BROWSER_MAX_ARCHIVE_BYTES: "536870912"
  XIANYU_FINGERPRINT_BROWSER_MAX_EXTRACTED_BYTES: "1073741824"

x-application-volumes: &application-volumes
  - product-images:/data/product-images
  - contact-avatars:/data/contact-avatars
  - web-notification-sounds:/data/web-notification-sounds
  - browser-profiles:/data/browser-profiles
  - fingerprint-chromium:/data/fingerprint-chromium
  - standard-chromium:/data/standard-chromium
  - runtime-secrets:/run/xianyu-secrets:ro
  - ./config/ca:/etc/xianyu/ca:ro

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  init-config:
    image: "${XIANYU_IMAGE:-192.168.2.5:5050/bug/xianyu:latest}"
    pull_policy: always
    platform: linux/amd64
    command:
      - init-config
    restart: "no"
    network_mode: none
    environment:
      XIANYU_RUNTIME_SECRET_DIR: /run/xianyu-secrets
      XIANYU_GENERATED_SECRETS: jwt-secret
      # 仅用于从旧部署迁移；全新部署保持未设置即可自动生成。
      XIANYU_JWT_SECRET: "${XIANYU_JWT_SECRET:-}"
    volumes:
      - runtime-secrets:/run/xianyu-secrets
    logging: *default-logging

  api:
    image: "${XIANYU_IMAGE:-192.168.2.5:5050/bug/xianyu:latest}"
    pull_policy: always
    platform: linux/amd64
    command:
      - api
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      <<: *application-environment
    volumes: *application-volumes
    networks:
      - frontend
      - backend
    logging: *default-logging
    shm_size: 1gb
    depends_on:
      init-config:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    image: "${XIANYU_IMAGE:-192.168.2.5:5050/bug/xianyu:latest}"
    pull_policy: always
    platform: linux/amd64
    command:
      - worker
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      <<: *application-environment
    volumes: *application-volumes
    networks:
      - backend
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - /app/tools/container_entry.py
        - worker-health
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    image: "${XIANYU_IMAGE:-192.168.2.5:5050/bug/xianyu:latest}"
    pull_policy: always
    platform: linux/amd64
    command:
      - gateway
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${XIANYU_BIND_IP:-0.0.0.0}:${XIANYU_HTTPS_PORT:-6161}:8443"
    volumes:
      - ./config/tls:/run/secrets/xianyu-tls:ro
    networks:
      - frontend
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/api/health', context=ssl._create_unverified_context(), timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  frontend:
  backend:

volumes:
  runtime-secrets:
  product-images:
  contact-avatars:
  web-notification-sounds:
  browser-profiles:
  fingerprint-chromium:
  standard-chromium:
