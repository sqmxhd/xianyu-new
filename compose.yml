name: xianyu

# 高级模式：只启动一个闲鱼应用容器，连接外部 PostgreSQL 和 Redis。
services:
  xianyu-app:
    container_name: xianyu-app
    image: "${XIANYU_IMAGE:-192.168.2.5:5050/bug/xianyu:latest}"
    pull_policy: always
    platform: linux/amd64
    command: [app]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      XIANYU_DATABASE_URL: "${XIANYU_DATABASE_URL:?请在 .env.docker 中填写外部 PostgreSQL 连接地址}"
      XIANYU_REDIS_URL: "${XIANYU_REDIS_URL:?请在 .env.docker 中填写外部 Redis 连接地址}"
      XIANYU_RUNTIME_SECRET_DIR: /run/xianyu-secrets
      XIANYU_GENERATED_SECRETS: jwt-secret
      XIANYU_INTERNAL_API_URL: http://127.0.0.1:8000
      XIANYU_API_HEALTH_URL: http://127.0.0.1:8000/api/health
      XIANYU_PUBLIC_BASE_URL: "${XIANYU_PUBLIC_BASE_URL:-}"
      XIANYU_CORS_ORIGINS: "${XIANYU_CORS_ORIGINS:-}"
      XIANYU_ACCESS_TOKEN_EXPIRES_MINUTES: "${XIANYU_ACCESS_TOKEN_EXPIRES_MINUTES:-1440}"
      XIANYU_ADMIN_SESSION_EXPIRES_DAYS: "${XIANYU_ADMIN_SESSION_EXPIRES_DAYS:-365}"
    ports:
      - "${XIANYU_BIND_IP:-0.0.0.0}:${XIANYU_HTTPS_PORT:-6161}:8443"
    volumes:
      - product-images:/data/product-images
      - contact-avatars:/data/contact-avatars
      - web-notification-sounds:/data/web-notification-sounds
      - browser-profiles:/data/browser-profiles
      - fingerprint-chromium:/data/fingerprint-chromium
      - standard-chromium:/data/standard-chromium
      - runtime-secrets:/run/xianyu-secrets
      - ./config/ca:/etc/xianyu/ca:ro
      - ./config/tls:/run/secrets/xianyu-tls:ro
      - ./config/tls:/run/secrets/chatwoot-tls:ro
    networks: [xianyu-internal]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    shm_size: 1gb
    healthcheck:
      test: [CMD, python, /app/tools/container_entry.py, app-health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

networks:
  xianyu-internal:
    name: xianyu_internal

volumes:
  runtime-secrets:
  product-images:
  contact-avatars:
  web-notification-sounds:
  browser-profiles:
  fingerprint-chromium:
  standard-chromium:
