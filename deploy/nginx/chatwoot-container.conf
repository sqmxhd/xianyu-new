user xianyu;
worker_processes auto;
pid /tmp/chatwoot-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    client_body_temp_path /tmp/chatwoot-nginx-client;
    proxy_temp_path /tmp/chatwoot-nginx-proxy;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream chatwoot_rails {
        server chatwoot-rails:3000;
        keepalive 32;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /run/secrets/chatwoot-tls/fullchain.pem;
        ssl_certificate_key /run/secrets/chatwoot-tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ChatwootTLS:10m;
        ssl_session_timeout 1d;

        location / {
            proxy_pass http://chatwoot_rails;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
