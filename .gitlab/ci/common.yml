.debian-trust:
  before_script:
    - |
      if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ] && [ -f "$CI_SERVER_TLS_CA_FILE" ]; then
        cp "$CI_SERVER_TLS_CA_FILE" /usr/local/share/ca-certificates/xianyu-gitlab.crt
        update-ca-certificates >/dev/null
      fi

.branch-or-release:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

.release-or-manual:
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
