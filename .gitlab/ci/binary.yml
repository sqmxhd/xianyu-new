linux-x64:
  stage: binary
  image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:${NODE_IMAGE_TAG}"
  tags:
    - docker
  needs:
    - job: backend
    - job: frontend
      artifacts: true
    - job: portability
  cache:
    key:
      files:
        - apps/api/requirements.txt
        - integrations/xianyu_core/requirements.txt
    paths:
      - .cache/pip/
    policy: pull-push
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends binutils python3 python3-pip python3-venv
    - rm -rf /var/lib/apt/lists/*
  script:
    - bash tools/package/build_linux.sh
    - python3 tools/package/upload_generic.py --platform linux-x64
  artifacts:
    name: "${PACKAGE_NAME}-${CI_COMMIT_SHORT_SHA}-linux-x64"
    expire_in: 14 days
    paths:
      - artifacts/xianyu-admin-*-linux-x64.tar.gz
      - artifacts/xianyu-admin-*-linux-x64.tar.gz.sha256
  extends:
    - .branch-or-release

windows-x64:
  stage: binary
  tags:
    - windows-x64
  needs:
    - job: backend
    - job: frontend
      artifacts: true
    - job: portability
  script:
    - 'powershell -NoProfile -ExecutionPolicy Bypass -File tools/package/build_windows.ps1'
    - 'python tools/package/upload_generic.py --platform windows-x64'
  artifacts:
    name: "${PACKAGE_NAME}-${CI_COMMIT_SHORT_SHA}-windows-x64"
    expire_in: 14 days
    paths:
      - artifacts/xianyu-admin-*-windows-x64.zip
      - artifacts/xianyu-admin-*-windows-x64.zip.sha256
  extends:
    - .branch-or-release
