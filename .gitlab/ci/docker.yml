.buildkit:
  stage: docker
  image:
    name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/moby/buildkit:${BUILDKIT_IMAGE_TAG}"
    entrypoint:
      - ""
  tags:
    - docker
  variables:
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"
  before_script:
    - |
      set -eu
      test -n "${CI_REGISTRY:-}"
      test -n "${CI_DEPENDENCY_PROXY_SERVER:-}"
      test -n "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX:-}"
      mkdir -p "$HOME/.docker" "$HOME/.config/buildkit/certs"

      registry_auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      proxy_auth="$(printf '%s:%s' "$CI_DEPENDENCY_PROXY_USER" "$CI_DEPENDENCY_PROXY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"},"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" "$registry_auth" \
        "$CI_DEPENDENCY_PROXY_SERVER" "$proxy_auth" \
        > "$HOME/.docker/config.json"

      if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ] && [ -f "$CI_SERVER_TLS_CA_FILE" ]; then
        registry_cert_dir="$HOME/.config/buildkit/certs/$CI_REGISTRY"
        proxy_cert_dir="$HOME/.config/buildkit/certs/$CI_DEPENDENCY_PROXY_SERVER"
        mkdir -p "$registry_cert_dir" "$proxy_cert_dir"
        cp "$CI_SERVER_TLS_CA_FILE" "$registry_cert_dir/ca.pem"
        cp "$CI_SERVER_TLS_CA_FILE" "$proxy_cert_dir/ca.pem"
        {
          printf '[registry."%s"]\n' "$CI_REGISTRY"
          printf '  ca = ["%s"]\n' "$registry_cert_dir/ca.pem"
          printf '[registry."%s"]\n' "$CI_DEPENDENCY_PROXY_SERVER"
          printf '  ca = ["%s"]\n' "$proxy_cert_dir/ca.pem"
        } > "$HOME/.config/buildkit/buildkitd.toml"
        export BUILDKITD_FLAGS="$BUILDKITD_FLAGS --config $HOME/.config/buildkit/buildkitd.toml"
        export SSL_CERT_FILE="$CI_SERVER_TLS_CA_FILE"
      fi

image-amd64:
  extends:
    - .buildkit
    - .branch-or-release
  script:
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        version="${CI_COMMIT_TAG#v}"
      else
        version="${CI_COMMIT_SHORT_SHA}"
      fi
      names="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA,$CI_REGISTRY_IMAGE:$version"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        names="$names,$CI_REGISTRY_IMAGE:latest"
      elif [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH:-}" ]; then
        names="$names,$CI_REGISTRY_IMAGE:edge"
      fi
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --opt "build-arg:BASE_IMAGE_PREFIX=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX" \
        --opt "build-arg:BUILD_VERSION=$version" \
        --opt "build-arg:BUILD_COMMIT=$CI_COMMIT_SHA" \
        --import-cache "type=registry,ref=$CI_REGISTRY_IMAGE/cache:linux-amd64" \
        --export-cache "type=registry,ref=$CI_REGISTRY_IMAGE/cache:linux-amd64,mode=max" \
        --output "type=image,name=$names,push=true"

archive-amd64:
  extends:
    - .buildkit
    - .release-or-manual
  script:
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        version="${CI_COMMIT_TAG#v}"
      else
        version="${CI_COMMIT_SHORT_SHA}"
      fi
      archive="$PACKAGE_NAME-$version-linux-amd64.oci.tar"
      mkdir -p artifacts
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --opt "build-arg:BASE_IMAGE_PREFIX=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX" \
        --opt "build-arg:BUILD_VERSION=$version" \
        --opt "build-arg:BUILD_COMMIT=$CI_COMMIT_SHA" \
        --import-cache "type=registry,ref=$CI_REGISTRY_IMAGE/cache:linux-amd64" \
        --output "type=oci,name=$PACKAGE_NAME:$version,dest=artifacts/$archive"
      gzip -9 "artifacts/$archive"
      sha256sum "artifacts/$archive.gz" > "artifacts/$archive.gz.sha256"
  artifacts:
    name: "${PACKAGE_NAME}-${CI_COMMIT_SHORT_SHA}-linux-amd64-oci"
    expire_in: 14 days
    paths:
      - artifacts/xianyu-admin-*-linux-amd64.oci.tar.gz
      - artifacts/xianyu-admin-*-linux-amd64.oci.tar.gz.sha256
