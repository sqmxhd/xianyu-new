.buildkit:
  stage: docker
  image:
    name: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/moby/buildkit:${BUILDKIT_IMAGE_TAG}"
    entrypoint: [""]
  tags: [docker]
  variables:
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"
  before_script:
    - |
      set -eu
      test -n "${CI_REGISTRY:-}"
      test -n "${CI_DEPENDENCY_PROXY_SERVER:-}"
      test -n "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX:-}"
      mkdir -p "$HOME/.docker"
      registry_auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      proxy_auth="$(printf '%s:%s' "$CI_DEPENDENCY_PROXY_USER" "$CI_DEPENDENCY_PROXY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"},"%s":{"auth":"%s"}}}\n' \
        "$CI_REGISTRY" "$registry_auth" \
        "$CI_DEPENDENCY_PROXY_SERVER" "$proxy_auth" \
        > "$HOME/.docker/config.json"

image-amd64:
  extends: [.buildkit, .container-delivery]
  needs:
    - job: backend
      artifacts: false
    - job: frontend
      artifacts: false
    - job: portability
      artifacts: false
  script:
    - |
      set -eu
      version="${RELEASE_SERIES}.${CI_PIPELINE_IID}"
      names="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA,$CI_REGISTRY_IMAGE:$version,$CI_REGISTRY_IMAGE:latest"
      case "$version" in
        ""|[.-]*|*[!A-Za-z0-9_.-]*)
          echo "Invalid container version tag: $version" >&2
          exit 1
          ;;
      esac
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --opt platform=linux/amd64 \
        --opt "build-arg:BASE_IMAGE_PREFIX=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX" \
        --opt "build-arg:BUILD_VERSION=$version" \
        --opt "build-arg:BUILD_COMMIT=$CI_COMMIT_SHA" \
        --import-cache "type=registry,ref=$CI_REGISTRY_IMAGE/cache:linux-amd64" \
        --export-cache "type=registry,ref=$CI_REGISTRY_IMAGE/cache:linux-amd64,mode=max" \
        --output "type=image,\"name=$names\",push=true"

archive-amd64:
  extends: [.buildkit, .container-delivery]
  needs:
    - job: backend
      artifacts: false
    - job: frontend
      artifacts: false
    - job: portability
      artifacts: false
  script:
    - |
      set -eu
      version="${RELEASE_SERIES}.${CI_PIPELINE_IID}"
      case "$version" in
        ""|[.-]*|*[!A-Za-z0-9_.-]*)
          echo "Invalid archive version tag: $version" >&2
          exit 1
          ;;
      esac
      archive="xianyu-admin-$version-linux-amd64.docker.tar"
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --opt platform=linux/amd64 \
        --opt "build-arg:BASE_IMAGE_PREFIX=$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX" \
        --opt "build-arg:BUILD_VERSION=$version" \
        --opt "build-arg:BUILD_COMMIT=$CI_COMMIT_SHA" \
        --import-cache "type=registry,ref=$CI_REGISTRY_IMAGE/cache:linux-amd64" \
        --output "type=docker,name=xianyu/xianyu-admin:$version,dest=$archive"
      gzip -9 "$archive"
      sha256sum "$archive.gz" > "$archive.gz.sha256"
  artifacts:
    name: "xianyu-admin-${CI_COMMIT_SHORT_SHA}-linux-amd64-docker"
    expire_in: 14 days
    paths:
      - xianyu-admin-*-linux-amd64.docker.tar.gz
      - xianyu-admin-*-linux-amd64.docker.tar.gz.sha256
      - 开始部署.sh
      - compose.all.yml
